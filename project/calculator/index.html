
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="styless.css">
</head>

<body>
<footer>
    
<h1>Calculator</h1>
    <div class="calculator">


        <input type="text" id="display" placeholder="0">

        <div class="button">
            <button class="AC">AC</button>
            <button class="symbol">DEL</button>
            <button class="symbol">%</button>
            <button class="symbol">/</button>
        </div>

        <div class="button">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
        </div>

        <div class="button">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="symbol">-</button>
        </div>

        <div class="button">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="symbol">+</button>
        </div>

        <div class="button">
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
